<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendCade - Retro Arcade Salonu</title>
    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121214;
            color: #f1f1f1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .card {
            background-color: #1a1a24;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            border-radius: 10px;
            display: inline-block;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            margin-top: 15px;
        }

        input {
            background-color: #0d0d11;
            border: 1px solid #ff00ff;
            color: #ffffff;
            padding: 12px;
            margin: 10px 0;
            width: 90%;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        button {
            background-color: #ff00ff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 5px;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: #00ffcc;
            color: #121214;
            box-shadow: 0 0 15px #00ffcc;
        }

        #tokens {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #ffd700;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .game-item {
            background: #121214;
            border: 1px solid #ff00ff;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Admin Paneli Tasarımı (Ayrı ve Sarı Vurgulu) */
        #admin-panel {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            display: none;
        }
        #admin-panel h3 {
            color: #ffd700;
            text-shadow: 0 0 8px #ffd700;
        }
        #admin-panel input {
            border-color: #ffd700;
        }
    </style>
</head>
<body>

    <h1>VENDCADE</h1>
    <div class="subtitle">Klasik Jetonlu Arcade Salonu</div>

    <!-- 1. Giriş / Kayıt Formu -->
    <div id="auth-section" class="card">
        <h3 style="color: #ff00ff;">Giriş Yap / Kayıt Ol</h3>
        <input type="email" id="email" placeholder="E-posta adresiniz"><br>
        <input type="password" id="password" placeholder="Şifreniz"><br>
        <button onclick="handleSignUp()">Kayıt Ol</button>
        <button onclick="handleSignIn()">Giriş Yap</button>
    </div>

    <!-- 2. Oyuncu Paneli ve Oyun Salonu -->
    <div id="player-panel" class="card" style="display:none;">
        <h3 style="color: #00ffcc;">Arcade Salonu</h3>
        <p>Bakiyeniz: <span id="tokens">0</span> Jeton</p>
        
        <div id="game-menu">
            <div class="game-grid">
                <div class="game-item">
                    <span>Retro Tank Savaşı</span>
                    <button onclick="playGame('Tank Savaşı')">1 Jeton Harca & Başlat</button>
                </div>
            </div>
            <br>
            <button onclick="handleSignOut()" style="background-color: #555;">Çıkış Yap</button>
        </div>

        <!-- EmulatorJS Ekranı -->
        <div id="emulator-container" style="display:none; margin-top: 15px;">
            <div style="width:100%; height:350px; background:#000; margin:0 auto; position:relative;" id="game"></div>
            <button onclick="exitGame()" style="margin-top: 10px; background-color: #ff4444;">Oyundan Çık / Menüye Dön</button>
        </div>
    </div>

    <!-- 3. Ayrı Admin Paneli -->
    <div id="admin-panel" class="card">
        <h3>Yönetici Kontrol Paneli</h3>
        <p>Sistem ve Jeton Yönetimi</p>
        <input type="text" id="target-email" placeholder="Kullanıcı E-posta"><br>
        <input type="number" id="target-tokens" placeholder="Eklenecek Jeton Miktarı"><br>
        <button onclick="adminAddTokens()" style="background-color: #ffd700; color: #121214;">Jeton Tanımla</button>
        <br><br>
        <button onclick="handleSignOut()" style="background-color: #555;">Yönetici Çıkışı</button>
    </div>

    <script>
        // --- SUPABASE BAĞLANTI BİLGİLERİ ---
        const SUPABASE_URL = 'https://frqywbtxxdzihrznxbh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycXl3Ynp0eHhkemlocnpueGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODU1MzMsImV4cCI6MjEwNzU2MTUzM30.0Z856vVB6IkFuNXDXtbpRr6JJzhHtPjKQQiMgjx0k-c';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Sayfa açıldığında oturumu denetle
        window.onload = async function() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    await evaluateUserRole(session.user);
                }
            } catch (err) {
                console.error("Oturum yüklenirken hata oluştu:", err);
            }
        };

        // Kayıt Ol
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                alert("Lütfen e-posta ve şifre girin.");
                return;
            }

            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) {
                alert("Kayıt hatası: " + error.message);
            } else {
                alert("Kayıt başarılı! Giriş yapabilirsiniz.");
            }
        }

        // Giriş Yap
        async function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                alert("Lütfen e-posta ve şifre girin.");
                return;
            }

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Giriş hatası: " + error.message);
            } else {
                await evaluateUserRole(data.user);
            }
        }

        // Çıkış Yap
        async function handleSignOut() {
            await _supabase.auth.signOut();
            document.getElementById('auth-section').style.display = 'inline-block';
            document.getElementById('player-panel').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
        }

        // Kullanıcı Rolünü ve Verilerini Kontrol Etme
        async function evaluateUserRole(user) {
            document.getElementById('auth-section').style.display = 'none';

            let { data, error } = await _supabase
                .from('profiles')
                .select('tokens, is_admin')
                .eq('id', user.id)
                .single();

            // Eğer profil tablosunda kayıt yoksa otomatik oluştur
            if (error || !data) {
                await _supabase.from('profiles').insert([{ id: user.id, tokens: 3, is_admin: false }]);
                data = { tokens: 3, is_admin: false };
            }

            if (data.is_admin) {
                // Yönetici Panelini Aç
                document.getElementById('admin-panel').style.display = 'inline-block';
                document.getElementById('player-panel').style.display = 'none';
            } else {
                // Oyuncu Panelini Aç
                document.getElementById('player-panel').style.display = 'inline-block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('tokens').innerText = data.tokens;
            }
        }

        // Jeton Düşerek Oyunu Başlat
        async function playGame(gameName) {
            const { data: { user } } = await _supabase.auth.getUser();
            let { data } = await _supabase.from('profiles').select('tokens').eq('id', user.id).single();
            
            if (data && data.tokens > 0) {
                let yeniJeton = data.tokens - 1;
                await _supabase.from('profiles').update({ tokens: yeniJeton }).eq('id', user.id);
                document.getElementById('tokens').innerText = yeniJeton;
                
                document.getElementById('game-menu').style.display = 'none';
                document.getElementById('emulator-container').style.display = 'block';

                // EmulatorJS Ayarları
                window.EJS_player = '#game';
                window.EJS_gameUrl = 'https://raw.githubusercontent.com/libretro/libretro-super/master/README.md'; 
                window.EJS_core = 'nes';
                window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/';

                if (!document.getElementById('ejs-script')) {
                    const script = document.createElement('script');
                    script.id = 'ejs-script';
                    script.src = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@main/data/loader.js';
                    document.body.appendChild(script);
                }
            } else {
                alert("Yetersiz jeton! Lütfen yöneticiden bakiye talep edin.");
            }
        }

        // Oyundan Çıkış
        function exitGame() {
            document.getElementById('emulator-container').style.display = 'none';
            document.getElementById('game-menu').style.display = 'block';
        }

        // Admin Jeton Tanımlama (Örnek Fonksiyon)
        async function adminAddTokens() {
            const targetEmail = document.getElementById('target-email').value.trim();
            const tokenAmount = parseInt(document.getElementById('target-tokens').value);

            if (!targetEmail || isNaN(tokenAmount)) {
                alert("Lütfen geçerli bir e-posta ve miktar girin.");
                return;
            }

            alert(`Yönetici İşlemi: ${targetEmail} adlı kullanıcıya ${tokenAmount} jeton tanımlama isteği işleme alındı.`);
        }
    </script>
</body>
</html>

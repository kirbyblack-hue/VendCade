<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Online Arcade - Giriş</title>
    <!-- Supabase JavaScript Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Retro Arcade Salonu</h1>

    <!-- Giriş / Kayıt Formu -->
    <div id="auth-section">
        <h3>Giriş Yap veya Kayıt Ol</h3>
        <input type="email" id="email" placeholder="E-posta adresiniz"><br><br>
        <input type="password" id="password" placeholder="Şifreniz"><br><br>
        <button onclick="signUp()">Kayıt Ol</button>
        <button onclick="signIn()">Giriş Yap</button>
    </div>

    <!-- Oyuncu Paneli (Giriş Yapınca Görünür) -->
    <div id="game-section" style="display:none;">
        <h3>Hoş Geldiniz!</h3>
        <p>Bakiyeniz: <span id="tokens">0</span> Jeton</p>
        <button onclick="playGame()">1 Jeton Harca ve Oyuna Başla</button><br><br>
        <button onclick="signOut()">Çıkış Yap</button>
    </div>

    <script>
        // Supabase Bağlantı Bilgileriniz (Kendi bilgilerinizle değiştirin)
        const SUPABASE_URL = 'SENIN_SUPABASE_URL_ADRESIN';
        const SUPABASE_ANON_KEY = 'SENIN_SUPABASE_ANON_KEY_DEGERIN';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Sayfa yüklendiğinde kullanıcı oturumunu kontrol et
        window.onload = async function() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                showGameSection(session.user);
            }
        };

        // Kayıt Olma Fonksiyonu
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signUp({ email, password });
            if (error) {
                alert("Kayıt hatası: " + error.message);
            } else {
                alert("Kayıt başarılı! E-postanızı kontrol edin veya giriş yapın.");
            }
        }

        // Giriş Yapma Fonksiyonu
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Giriş hatası: " + error.message);
            } else {
                showGameSection(data.user);
            }
        }

        // Çıkış Yapma Fonksiyonu
        async function signOut() {
            await _supabase.auth.signOut();
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('game-section').style.display = 'none';
        }

        // Oyun Ekranını Gösterme ve Jetonları Çekme
        async function showGameSection(user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';

            // Kullanıcının veritabanındaki jeton miktarını çekelim
            let { data, error } = await _supabase
                .from('profiles')
                .select('tokens')
                .eq('id', user.id)
                .single();

            if (data) {
                document.getElementById('tokens').innerText = data.tokens;
            } else {
                // Eğer kullanıcı ilk defa giriyorsa ve profili yoksa 3 jeton hediye verelim
                await _supabase.from('profiles').insert([{ id: user.id, tokens: 3 }]);
                document.getElementById('tokens').innerText = 3;
            }
        }

        // Oyuna Başlama / Jeton Düşme Simülasyonu
        async function playGame() {
            const { data: { user } } = await _supabase.auth.getUser();
            
            // Mevcut jetonları al
            let { data } = await _supabase.from('profiles').select('tokens').eq('id', user.id).single();
            
            if (data.tokens > 0) {
                let yeniJeton = data.tokens - 1;
                // Veritabanında jetonu 1 azalt
                await _supabase.from('profiles').update({ tokens: yeniJeton }).eq('id', user.id);
                
                document.getElementById('tokens').innerText = yeniJeton;
                alert("Jeton harcandı! Emülatör başlatılıyor...");
                // window.location.href = "game.html"; // Buraya emülatör sayfanızı yazabilirsiniz
            } else {
                alert("Yetersiz jeton! Lütfen bakiye yükleyin.");
            }
        }
    </script>
</body>
</html>

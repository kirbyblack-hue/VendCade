<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="UTF-8">
			<title>Online Arcade</title>
		</head>
	<body>
		<h1>Retro Arcade Salonuna Hoş Geldiniz</h1>

		<div id="auth-section">
			<h3>Giriş Yap</h3>
			<input type="email" id="email" placeholder="E-posta">
				<input type="password" id="password" placeholder="Şifre">
					<button onclick="login()">Giriş Yap</button>
				</div>

		<div id="game-section" style="display:none;">
			<p>
				Bakiyeniz: <span id="tokens">0</span> Jeton
			</p>
			<button onclick="startGame()">1 Jeton Harca ve Oyunu Başlat</button>
		</div>

		<script>
			let userToken = "";

			async function login() {
			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;

			const res = await fetch('/.netlify/functions/login', {
			method: 'POST',
			body: JSON.stringify({ email, password })
			});
			const data = await res.json();

			if (res.ok) {
			userToken = data.token;
			document.getElementById('tokens').innerText = data.tokens;
			document.getElementById('auth-section').style.display = 'none';
			document.getElementById('game-section').style.display = 'block';
			} else {
			alert("Giriş başarısız: " + data.error);
			}
			}

			async function startGame() {
			const res = await fetch('/.netlify/functions/play', {
			method: 'POST',
			headers: { 'Authorization': 'Bearer ' + userToken }
			});
			const data = await res.json();

			if (res.ok) {
			alert("Jeton harcandı! Oyun yükleniyor...");
			window.location.href = "/game.html"; // Emülatör sayfasına yönlendir
			} else {
			alert("Hata: " + data.error);
			}
			}
		</script>
	</body>
</html>

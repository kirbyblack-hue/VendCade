<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendCade - Retro Arcade Salonu</title>
    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121214;
            color: #f1f1f1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .subtitle { color: #888; margin-bottom: 20px; font-size: 1rem; }

        .card {
            background-color: #1a1a24;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            border-radius: 10px;
            display: inline-block;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            margin-top: 15px;
            text-align: left;
        }

        .card h3 { text-align: center; }

        input, select {
            background-color: #0d0d11;
            border: 1px solid #ff00ff;
            color: #ffffff;
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }

        input[type="file"] {
            border: 1px dashed #ff00ff;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        button {
            background-color: #ff00ff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: #00ffcc;
            color: #121214;
            box-shadow: 0 0 15px #00ffcc;
        }

        #tokens {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #ffd700;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .game-item {
            background: #121214;
            border: 1px solid #ff00ff;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #admin-panel {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            display: none;
        }
        #admin-panel h3 { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
        #admin-panel input, #admin-panel select { border-color: #ffd700; }
    </style>
</head>
<body>

    <h1>VENDCADE</h1>
    <div class="subtitle">Klasik Jetonlu Arcade Salonu</div>

    <!-- Giriş Formu -->
    <div id="auth-section" class="card" style="text-align: center;">
        <h3 style="color: #ff00ff;">Giriş Yap / Kayıt Ol</h3>
        <input type="email" id="email" placeholder="E-posta adresiniz">
        <input type="password" id="password" placeholder="Şifreniz">
        <button onclick="handleSignUp()">Kayıt Ol</button>
        <button onclick="handleSignIn()">Giriş Yap</button>
    </div>

    <!-- Oyuncu Paneli -->
    <div id="player-panel" class="card" style="display:none; text-align: center;">
        <h3 style="color: #00ffcc;">Arcade Salonu</h3>
        <p>Bakiyeniz: <span id="tokens">0</span> Jeton</p>
        
        <div id="game-menu">
            <p style="color:#aaa; font-size: 0.9rem;">Oynamak istediğiniz oyunu seçin (1 Jeton düşer):</p>
            <div class="game-grid" id="dynamic-game-list"></div>
            <br>
            <button onclick="handleSignOut()" style="background-color: #555;">Çıkış Yap</button>
        </div>

        <!-- EmulatorJS Ekranı -->
        <div id="emulator-container" style="display:none; margin-top: 15px;">
            <div style="width:100%; height:400px; background:#000; margin:0 auto; position:relative;" id="game"></div>
            <button onclick="exitGame()" style="margin-top: 10px; background-color: #ff4444; width:100%;">Oyundan Çık / Menüye Dön</button>
        </div>
    </div>

    <!-- Yönetici Paneli -->
    <div id="admin-panel" class="card">
        <h3>Yönetici Kontrol Paneli</h3>
        <hr style="border-color: #444;">
        
        <h4 style="color: #00ffcc; margin-top:15px;">📤 ROM Dosyası Yükle & Oyun Ekle</h4>
        <input type="text" id="new-game-title" placeholder="Oyun Adı (Örn: Pacman)">
        <select id="new-game-core">
            <option value="arcade">Arcade (MAME)</option>
            <option value="nes">NES (Nintendo)</option>
            <option value="snes">SNES</option>
            <option value="gba">Game Boy Advance</option>
        </select>
        <label style="font-size: 0.85rem; color: #ffd700;">ROM Arşivi (.zip):</label>
        <input type="file" id="rom-file-input" accept=".zip">
        <button onclick="adminUploadAndAddGame()" style="background-color: #00ffcc; color: #121214;">Yükle ve Oyunu Ekle</button>

        <br>
        <hr style="border-color: #444; margin: 20px 0;">

        <h4 style="color: #ffd700;">🎛️ Makine Arkası Switch (DIP Switch)</h4>
        <select id="dip-switch-toggle">
            <option value="false">DIP Switch: Kapalı (Normal)</option>
            <option value="true">DIP Switch: Açık (Ayar Modu)</option>
        </select>

        <br><br>
        <button onclick="handleSignOut()" style="background-color: #555;">Yönetici Çıkışı</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://frqywbztxxdzihrznxbh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycXl3Ynp0eHhkemlocnpueGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODU1MzMsImV4cCI6MjEwNzU2MTUzM30.0Z856vVB6IkFuNXDXtbpRr6JJzhHtPjKQQiMgjx0k-c';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async function() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) await evaluateUserRole(session.user);
            } catch (err) {
                console.error(err);
            }
        };

        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) alert("Kayıt hatası: " + error.message);
            else alert("Kayıt başarılı! Giriş yapabilirsiniz.");
        }

        async function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Giriş hatası: " + error.message);
            else await evaluateUserRole(data.user);
        }

        async function handleSignOut() {
            await _supabase.auth.signOut();
            document.getElementById('auth-section').style.display = 'inline-block';
            document.getElementById('player-panel').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
        }

        async function evaluateUserRole(user) {
            document.getElementById('auth-section').style.display = 'none';

            let { data, error } = await _supabase.from('profiles').select('tokens, is_admin').eq('id', user.id).single();
            if (error || !data) {
                await _supabase.from('profiles').insert([{ id: user.id, tokens: 3, is_admin: false }]);
                data = { tokens: 3, is_admin: false };
            }

            if (data.is_admin) {
                document.getElementById('admin-panel').style.display = 'inline-block';
                document.getElementById('player-panel').style.display = 'none';
            } else {
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('player-panel').style.display = 'inline-block';
                document.getElementById('tokens').innerText = data.tokens;
                loadGamesToUI();
            }
        }

        async function loadGamesToUI() {
            const listContainer = document.getElementById('dynamic-game-list');
            listContainer.innerHTML = 'Yükleniyor...';

            const { data: games, error } = await _supabase.from('games').select('*');
            if (error || !games || games.length === 0) {
                listContainer.innerHTML = '<p style="color:#888;">Henüz eklenmiş oyun yok.</p>';
                return;
            }

            listContainer.innerHTML = '';
            games.forEach(game => {
                listContainer.innerHTML += `
                    <div class="game-item">
                        <span>🎮 ${game.title} <small style="color:#00ffcc">(${game.core.toUpperCase()})</small></span>
                        <button onclick="playGame('${game.title}', '${game.rom_url}', '${game.core}')" style="width:auto; margin:0; padding:8px 12px;">Oyna (1 Jeton)</button>
                    </div>
                `;
            });
        }

        async function adminUploadAndAddGame() {
            const title = document.getElementById('new-game-title').value.trim();
            const core = document.getElementById('new-game-core').value;
            const fileInput = document.getElementById('rom-file-input');

            if (!title || fileInput.files.length === 0) {
                alert("Lütfen oyun adını yazın ve bir ROM (.zip) dosyası seçin.");
                return;
            }

            const file = fileInput.files[0];
            // Türkçe karakterleri ve boşlukları temizleyerek dosya adı oluşturalım (400 hatasını önler)
            const cleanFileName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
            const fileName = `${Date.now()}_${cleanFileName}`;

            alert("ROM dosyası yükleniyor...");

            const { error: uploadError } = await _supabase.storage
                .from('games')
                .upload(fileName, file);

            if (uploadError) {
                alert("Yükleme hatası: " + uploadError.message);
                return;
            }

            const { data: publicUrlData } = _supabase.storage
                .from('games')
                .getPublicUrl(fileName);

            const rom_url = publicUrlData.publicUrl;

            const { error: dbError } = await _supabase.from('games').insert([{ title, core, rom_url }]);
            if (dbError) {
                alert("Veritabanı kayıt hatası: " + dbError.message);
            } else {
                alert("Oyun başarıyla yüklendi!");
                document.getElementById('new-game-title').value = '';
                document.getElementById('rom-file-input').value = '';
            }
        }

        async function playGame(title, romUrl, coreType) {
            const { data: { user } } = await _supabase.auth.getUser();
            let { data } = await _supabase.from('profiles').select('tokens').eq('id', user.id).single();
            
            if (data && data.tokens > 0) {
                let yeniJeton = data.tokens - 1;
                await _supabase.from('profiles').update({ tokens: yeniJeton }).eq('id', user.id);
                document.getElementById('tokens').innerText = yeniJeton;
                
                document.getElementById('game-menu').style.display = 'none';
                document.getElementById('emulator-container').style.display = 'block';

                const dipSwitchValue = document.getElementById('dip-switch-toggle') ? document.getElementById('dip-switch-toggle').value === 'true' : false;

                // Kararlı EmulatorJS CDN Yolları
                window.EJS_player = '#game';
                window.EJS_gameUrl = romUrl; 
                window.EJS_core = coreType;
                window.EJS_pathtodata = 'https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/';
                window.EJS_settings = { dipSwitches: dipSwitchValue };

                if (!document.getElementById('ejs-script')) {
                    const script = document.createElement('script');
                    script.id = 'ejs-script';
                    script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@master/data/loader.js';
                    document.body.appendChild(script);
                } else {
                    location.reload();
                }
            } else {
                alert("Yetersiz jeton!");
            }
        }

        function exitGame() {
            document.getElementById('emulator-container').style.display = 'none';
            document.getElementById('game-menu').style.display = 'block';
        }
    </script>
</body>
</html>
